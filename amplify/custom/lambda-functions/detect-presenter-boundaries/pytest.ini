[pytest]
# Local config for the detect-presenter-boundaries Lambda unit tests.
# Self-contained: no network, no AWS calls (see conftest.py).
python_files = test_*.py
python_functions = test_*
python_classes = Test*
filterwarnings =
    # boto3 warns about end-of-support for Python 3.9; environmental noise,
    # unrelated to these tests. Matched by message (it subclasses Warning).
    ignore:Boto3 will no longer support Python 3.9.*:Warning
